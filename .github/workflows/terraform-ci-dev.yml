---
name: Terraform CI - Dev

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
  terraform-plan-dev:
    name: "Terraform Plan (dev)"
    # Only run if manually triggered OR if 'run-plan-dev' label is added
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-plan-dev'))
    uses: >-
      kewalaka/github-azure-iac-templates/.github/workflows/terraform-plan.yml@main
    with:
      environment_name: "dev-iac-plan"
      tfvars_file: "./environments/dev.terraform.tfvars"
      # runner_name: "my-ubuntu-runner"
      # for more options check
      # https://github.com/kewalaka/github-azure-iac-templates/blob/main/.github/workflows/terraform-plan.yml
    secrets: inherit
