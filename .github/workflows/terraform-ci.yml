---
name: Terraform CI

on:
  pull_request:
    paths:
      - 'iac/**'
      - '.github/workflows/terraform-ci.yml'

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
  detect-changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.detect.outputs.environments }}
      matrix_json: ${{ steps.detect.outputs.matrix_json }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed environments
        id: detect
        run: |
          # Get the list of changed files
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.event.after }}"
          fi

          echo "Comparing $BASE_SHA...$HEAD_SHA"
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check if any IaC files (excluding tfvars) changed
          IAC_CHANGED=$(echo "$CHANGED_FILES" | \
            grep -E '^iac/.*\.(tf|hcl)$' | \
            grep -v 'terraform.tfvars' || true)

          # Check if any tfvars files changed
          TFVARS_CHANGED=$(echo "$CHANGED_FILES" | \
            grep -E '^iac/environments/.*\.terraform\.tfvars$' || true)

          # Determine which environments to test
          ENVIRONMENTS=()

          if [ -n "$IAC_CHANGED" ]; then
            # IaC files changed - test all environments
            echo "IaC files changed, testing all environments"
            ENVIRONMENTS=("dev" "test" "uat" "prod")
          elif [ -n "$TFVARS_CHANGED" ]; then
            # Only tfvars changed - test specific environments
            echo "Only tfvars files changed, testing specific environments"
            while IFS= read -r file; do
              if [ -n "$file" ]; then
                # Extract environment name from path
                # like iac/environments/dev.terraform.tfvars
                ENV=$(basename "$file" .terraform.tfvars)
                if [[ "$ENV" =~ ^(dev|test|uat|prod)$ ]]; then
                  ENVIRONMENTS+=("$ENV")
                fi
              fi
            done <<< "$TFVARS_CHANGED"
          else
            echo "No relevant IaC or tfvars files changed"
            ENVIRONMENTS=()
          fi

          # Remove duplicates and sort
          UNIQUE_ENVS=($(printf '%s\n' "${ENVIRONMENTS[@]}" | sort -u))

          # Create JSON array for matrix
          if [ ${#UNIQUE_ENVS[@]} -eq 0 ]; then
            MATRIX_JSON='[]'
            ENV_LIST=''
          else
            MATRIX_JSON=$(printf '%s\n' "${UNIQUE_ENVS[@]}" | \
              jq -R -s -c 'split("\n") | map(select(length > 0))')
            ENV_LIST=$(IFS=,; echo "${UNIQUE_ENVS[*]}")
          fi

          echo "Environments to test: ${UNIQUE_ENVS[*]}"
          echo "environments=$ENV_LIST" >> $GITHUB_OUTPUT
          echo "matrix_json=$MATRIX_JSON" >> $GITHUB_OUTPUT

  terraform-plan:
    name: "Terraform Plan (${{ matrix.environment }})"
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix_json != '[]'
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.detect-changes.outputs.matrix_json) }}
    uses: >-
      kewalaka/github-azure-iac-templates/.github/workflows/terraform-plan.yml@main
    with:
      environment_name: "${{ matrix.environment }}-iac-plan"
      tfvars_file: "./environments/${{ matrix.environment }}.terraform.tfvars"
      # runner_name: "my-ubuntu-runner"
      # for more options check
      # https://github.com/kewalaka/github-azure-iac-templates/blob/main/.github/workflows/terraform-plan.yml
    secrets: inherit
