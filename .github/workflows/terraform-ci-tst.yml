---
name: Terraform CI - Tst

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
    paths:
      - 'iac/**'
      - '.github/workflows/**'

defaults:
  run:
    shell: bash

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

jobs:
  terraform-plan-tst:
    name: "Terraform Plan (tst)"
    # Only run if manually triggered OR if 'run-plan-tst' label is added
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-plan-tst'))
    uses: >-
      kewalaka/github-azure-iac-templates/.github/workflows/terraform-plan-template.yml@main
    with:
      target_environment: "tst-iac-plan"
      root_iac_folder_relative_path: './iac'
      tfvars_file: "./environments/tst.terraform.tfvars"
      # runner_name: "my-ubuntu-runner"
      # for more options check
      # https://github.com/kewalaka/github-azure-iac-templates/blob/main/.github/workflows/terraform-plan-template.yml
    secrets: inherit
